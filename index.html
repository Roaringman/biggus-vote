<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Biggus Tabard-afstemning</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Biggus Tabard-afstemning</h1>
  <p class="sub" id="sub"></p>
  <div id="banner"></div>

  <div class="panel">
    <label for="name">Dit karakternavn</label>
    <input type="text" id="name" maxlength="40" autocomplete="off" placeholder="f.eks. Grommash">
  </div>

  <div class="grid" id="grid"></div>

  <button id="submit" disabled>Afgiv stemme</button>
  <div class="msg" id="msg"></div>

  <p style="margin-top:32px"><a href="results.html">Se resultater og hvem der har stemt &rarr;</a></p>
</main>

<div class="lightbox" id="lightbox"><img alt=""></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script>
  const max = CONFIG.votesPerPerson;
  const picked = new Set();
  const $ = id => document.getElementById(id);

  $("sub").innerHTML = max > 1
    ? `<b>Runde ${CONFIG.round}: Du har ${max} stemmer.</b> Vælg de ${max} designs, du bedst kan lide. Du kan kun afgive dine stemmer én gang, og alle stemmer logges med navn.`
    : `<b>Runde ${CONFIG.round}: Du har 1 stemme.</b> Vælg det design, du bedst kan lide. Du kan kun stemme én gang, og alle stemmer logges med navn.`;
  if (DEMO) $("banner").innerHTML = `<div class="banner warn">Demotilstand: ingen scriptUrl i config.js, så stemmer gemmes kun i denne browser.</div>`;
  if (!CONFIG.open) $("banner").innerHTML += `<div class="banner warn">Afstemningen for runde ${CONFIG.round} er lukket.</div>`;

  // Countdown until voting opens.
  const opensAt = CONFIG.opensAt ? new Date(CONFIG.opensAt).getTime() : 0;
  const notYet = () => Date.now() < opensAt;
  const countdown = document.createElement("div");
  $("banner").appendChild(countdown);
  function tick() {
    if (!notYet()) { countdown.remove(); render(); return; }
    let s = Math.floor((opensAt - Date.now()) / 1000);
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); s %= 60;
    const tz = { timeZone: "Europe/Copenhagen" };
    const day = new Date(opensAt).toLocaleDateString("da-DK", { ...tz, weekday: "long" });
    const time = new Date(opensAt).toLocaleTimeString("da-DK", { ...tz, hour: "2-digit", minute: "2-digit" });
    countdown.className = "banner warn";
    countdown.innerHTML = `Afstemningen åbner ${day} kl. ${time} &ndash; om <b>${h}t ${String(m).padStart(2, "0")}m ${String(s).padStart(2, "0")}s</b>. Kig på designene imens!`;
    setTimeout(tick, 1000);
  }

  for (const d of CONFIG.designs) {
    const card = document.createElement("div");
    card.className = "card";
    card.innerHTML = `<img src="${d.image}" alt="${d.name}"><div class="name">${d.name}</div>
      ${d.desc ? `<div class="desc">${d.desc}</div>` : ""}
      <span class="zoom">forstør</span><div class="tag"></div>`;
    card.querySelector(".zoom").onclick = e => {
      e.stopPropagation();
      $("lightbox").querySelector("img").src = d.image;
      $("lightbox").classList.add("show");
    };
    card.onclick = () => {
      if (picked.has(d.id)) picked.delete(d.id);
      else if (picked.size < max) picked.add(d.id);
      else if (max === 1) { picked.clear(); picked.add(d.id); }
      render();
    };
    card.dataset.id = d.id;
    $("grid").appendChild(card);
  }
  $("lightbox").onclick = () => $("lightbox").classList.remove("show");

  function render() {
    for (const card of $("grid").children) {
      const on = picked.has(card.dataset.id);
      card.classList.toggle("picked", on);
      card.querySelector(".tag").textContent = on ? "✔ Valgt" : "";
    }
    const name = $("name").value.trim();
    $("submit").disabled = !CONFIG.open || notYet() || !name || picked.size !== max;
    $("submit").textContent = notYet() ? "Afstemningen er ikke åben endnu" : picked.size === max ? (max > 1 ? "Afgiv stemmer" : "Afgiv stemme") : `Vælg ${max - picked.size} ${max - picked.size > 1 ? "designs" : "design"} mere`;
  }
  $("name").oninput = render;
  render();
  tick();

  // The server script replies in English; show Danish instead.
  function danishError(err, name) {
    if (!err) return "Noget gik galt.";
    if (/already voted/i.test(err)) return `"${name}" har allerede stemt i runde ${CONFIG.round}. Kontakt en officer, hvis det er en fejl.`;
    if (/enter your name/i.test(err)) return "Skriv dit navn.";
    if (/pick a design/i.test(err)) return "Vælg et design.";
    return err;
  }

  $("submit").onclick = async () => {
    const name = $("name").value.trim();
    const choices = CONFIG.designs.filter(d => picked.has(d.id)).map(d => d.id);
    const names = CONFIG.designs.filter(d => picked.has(d.id)).map(d => d.name).join(" og ");
    if (!confirm(`Stem som "${name}" på ${names}?\nDu kan ikke ændre det bagefter.`)) return;
    $("submit").disabled = true;
    $("msg").className = "msg";
    $("msg").textContent = "Sender...";
    try {
      const r = await submitVote(name, choices);
      if (r.ok) {
        $("msg").className = "msg ok";
        $("msg").textContent = `Tak ${name}, ${max > 1 ? "dine stemmer" : "din stemme"} på ${names} er registreret.`;
        picked.clear(); render(); $("submit").disabled = true;
      } else {
        $("msg").className = "msg err";
        $("msg").textContent = danishError(r.error, name);
        render();
      }
    } catch (e) {
      $("msg").className = "msg err";
      $("msg").textContent = "Kunne ikke nå afstemningsserveren. Prøv igen om lidt.";
      render();
    }
  };
</script>
</body>
</html>
